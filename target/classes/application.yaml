server:
  port: 8080

app:
  name: "Todo MVP"
  version: "2.0.0"
  api:
    version: "2.0.0"
  upload-dir: "uploads"
  log-details: true

spring:
  profiles:
    active: dev
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    root: DEBUG
    com.example.todo: DEBUG
app:
  log-details: true

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: INFO
    com.example.todo: WARN
app:
  log-details: false