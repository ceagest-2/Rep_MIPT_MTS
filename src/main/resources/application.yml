server:
  port: 8080

spring:
  application:
    name: resilient-secure-http-gateway
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-none}]"

app:
  security:
    pepper: ""
    users:
      user-password-hash: "$2a$10$7EqJtq98hPqEX7fNZaFWoOHi6JmM4n4LhM651c01qmPvvrLpzjAUe"
      reader-password-hash: "$2a$10$7EqJtq98hPqEX7fNZaFWoOHi6JmM4n4LhM651c01qmPvvrLpzjAUe"
  jwt:
    issuer: "resilient-secure-gateway"
    expiration-minutes: 60
    # Base64 encoded 32-byte secret for HS256.
    secret: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  external:
    base-url: "http://localhost:${server.port}/external/v1"
    user-agent: "ResilientSecureGateway/1.0"
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    unstable-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      externalApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.mipt.uriilesnikov.exception.TaskNotFoundException
  ratelimiter:
    instances:
      externalApi:
        limit-for-period: 5
        limit-refresh-period: 2s
        timeout-duration: 0
